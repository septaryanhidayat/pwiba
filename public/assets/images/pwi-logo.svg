<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="redWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="50.1%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Sunburst Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#goldGrad)" stroke="#B78103" stroke-width="3" />
  
  <!-- Outer Cog/Sun Rays details -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#6d4c41" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Inner Gold Disc -->
  <circle cx="100" cy="100" r="80" fill="#fef08a" stroke="#d97706" stroke-width="2" />

  <!-- Organization Text Path -->
  <path id="textCircle" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
  <text font-size="11" font-weight="900" fill="#1e293b" letter-spacing="1.5">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      PERSATUAN WARTAWAN INDONESIA
    </textPath>
  </text>
  
  <path id="textCircleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  <text font-size="11" font-weight="900" fill="#1e293b" letter-spacing="2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      BANYUASIN
    </textPath>
  </text>

  <!-- Center Shield -->
  <polygon points="100,42 145,55 140,118 100,150 60,118 55,55" fill="#ffffff" stroke="#b91c1c" stroke-width="3" />
  
  <!-- Pen Nib / Torch symbol in Shield -->
  <!-- Indonesian Flag Colors Inside Shield -->
  <path d="M 62,58 L 138,58 L 136,95 L 64,95 Z" fill="#dc2626" />
  <path d="M 64,95 L 136,95 L 100,143 Z" fill="#ffffff" />
  
  <!-- Pen Nib / Quill Symbol -->
  <path d="M 100,50 L 115,75 L 108,125 L 100,142 L 92,125 L 85,75 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="100" y1="75" x2="100" y2="125" stroke="#f59e0b" stroke-width="2" />
  <circle cx="100" cy="100" r="3.5" fill="#f59e0b" />
  
  <!-- Letters PWI -->
  <rect x="80" y="88" width="40" height="24" rx="4" fill="#0f172a" opacity="0.9" />
  <text x="100" y="105" font-size="14" font-weight="900" fill="#f59e0b" text-anchor="middle" font-family="Arial, sans-serif">PWI</text>
</svg>
